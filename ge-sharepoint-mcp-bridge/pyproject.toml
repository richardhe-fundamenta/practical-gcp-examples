[project]
name = "sharepoint-mcp-bridge"
version = "0.1.0"
description = "Private MCP bridge between Gemini Enterprise and Microsoft SharePoint Online / OneDrive"
readme = "README.md"
license = "MIT"
authors = [{ name = "Richard He" }]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastmcp>=4.1,<5",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
sharepoint-mcp-bridge = "sharepoint_mcp_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharepoint_mcp_bridge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
